<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeedWorld Voxel Scenes</title>
  <meta name="description" content="Interactive 3D procedural voxel art and lighting studies featuring the SeedWorld Tree House and Sakura Pagoda Garden scenes." />
  <meta property="og:title" content="SeedWorld Voxel Scenes" />
  <meta property="og:description" content="Interactive 3D procedural voxel art and lighting studies featuring the SeedWorld Tree House and Sakura Pagoda Garden scenes." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141a24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #f3f6fb;
    }
    #scene-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #141a24;
    }
    #scene-nav {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: rgba(16, 20, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
    }
    .scene-tab {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(243, 246, 251, 0.78);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .scene-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .scene-tab[aria-pressed="true"] {
      background: rgba(122, 226, 138, 0.22);
      border-color: rgba(122, 226, 138, 0.55);
      color: #ffffff;
    }
    @media (max-width: 720px) {
      #scene-nav {
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        transform: none;
        border-radius: 0;
        border-top: 0;
        border-left: 0;
        border-right: 0;
        justify-content: center;
        padding: 6px 8px;
        height: 44px;
      }
      #scene-frame {
        top: 44px;
        height: calc(100% - 44px);
      }
      .scene-tab {
        font-size: 11px;
        padding: 5px 10px;
      }
    }
  </style>
</head>
<body data-active-scene="seedworld">
  <nav id="scene-nav" aria-label="Scene selector">
    <button
      type="button"
      class="scene-tab"
      data-scene="seedworld"
      aria-pressed="true"
    >
      SeedWorld Tree House
    </button>
    <button
      type="button"
      class="scene-tab"
      data-scene="pagoda"
      aria-pressed="false"
    >
      Sakura Pagoda Garden
    </button>
  </nav>

  <main style="width:100%;height:100%;">
    <iframe
      id="scene-frame"
      data-testid="scene-frame"
      title="SeedWorld Tree House 3D Voxel Scene"
      src="/simple_scene/seedworld-tree-house_base.html"
      allow="fullscreen"
    ></iframe>
  </main>

  <script>
    (function () {
      const SCENES = {
        seedworld: {
          title: 'SeedWorld Tree House 3D Voxel Scene',
          src: '/simple_scene/seedworld-tree-house_base.html',
        },
        pagoda: {
          title: 'Sakura Pagoda Garden 3D Voxel Scene',
          src: '/simple_scene/google_ai_studio_pagoda.html',
        },
      };

      const frame = document.getElementById('scene-frame');
      const buttons = Array.from(document.querySelectorAll('.scene-tab'));

      function selectScene(sceneId, updateUrl) {
        const id = SCENES[sceneId] ? sceneId : 'seedworld';
        const config = SCENES[id];
        if (frame.getAttribute('src') !== config.src) {
          frame.setAttribute('src', config.src);
        }
        frame.setAttribute('title', config.title);
        document.body.dataset.activeScene = id;

        for (const btn of buttons) {
          const isActive = btn.dataset.scene === id;
          btn.setAttribute('aria-pressed', String(isActive));
        }

        if (updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set('scene', id);
          window.history.replaceState({}, '', url.toString());
        }
      }

      const initialParam = new URLSearchParams(window.location.search).get('scene');
      if (initialParam && SCENES[initialParam]) {
        selectScene(initialParam, false);
      }

      for (const btn of buttons) {
        btn.addEventListener('click', () => {
          selectScene(btn.dataset.scene, true);
        });
      }
    })();
  </script>
</body>
</html>
